<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Descalco Media Backoffice</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #0a0a0a 0%, #1a1a1a 100%);
            color: #ffffff;
            min-height: 100vh;
        }

        .header {
            background: rgba(255, 255, 255, 0.05);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            backdrop-filter: blur(20px);
        }

        .logo h1 {
            font-size: 1.5rem;
            font-weight: 700;
            background: linear-gradient(135deg, #ffffff 0%, #dc2626 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .header-actions {
            display: flex;
            gap: 1rem;
            align-items: center;
        }

        .btn {
            padding: 0.5rem 1rem;
            border: none;
            border-radius: 6px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.9rem;
        }

        .btn-primary {
            background: linear-gradient(135deg, #dc2626 0%, #b91c1c 100%);
            color: #ffffff;
        }

        .btn-primary:hover {
            background: linear-gradient(135deg, #b91c1c 0%, #991b1b 100%);
            transform: translateY(-1px);
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.1);
            color: #d1d5db;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.15);
        }

        .btn-danger {
            background: rgba(239, 68, 68, 0.1);
            color: #fca5a5;
            border: 1px solid rgba(239, 68, 68, 0.3);
        }

        .btn-danger:hover {
            background: rgba(239, 68, 68, 0.2);
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 1.5rem;
            margin-bottom: 3rem;
        }

        .stat-card {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 1.5rem;
            backdrop-filter: blur(20px);
        }

        .stat-card h3 {
            color: #a1a1aa;
            font-size: 0.9rem;
            font-weight: 500;
            margin-bottom: 0.5rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .stat-card .value {
            font-size: 2rem;
            font-weight: 700;
            color: #dc2626;
        }

        .projects-section {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 2rem;
            backdrop-filter: blur(20px);
        }

        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
        }

        .section-header h2 {
            font-size: 1.5rem;
            font-weight: 600;
        }

        .projects-grid {
            display: grid;
            gap: 1.5rem;
        }

        .project-card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 8px;
            padding: 1.5rem;
            display: grid;
            grid-template-columns: auto 1fr auto;
            gap: 1rem;
            align-items: center;
            transition: all 0.3s ease;
        }

        .project-card:hover {
            background: rgba(255, 255, 255, 0.06);
            border-color: rgba(220, 38, 38, 0.3);
        }

        .project-media-preview {
            width: 60px;
            height: 60px;
            border-radius: 6px;
            object-fit: cover;
            background: #333;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #666;
            font-size: 0.8rem;
        }

        .project-info h3 {
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 0.25rem;
        }

        .project-meta {
            display: flex;
            gap: 1rem;
            color: #a1a1aa;
            font-size: 0.9rem;
        }

        .project-type {
            background: rgba(34, 197, 94, 0.1);
            color: #86efac;
            padding: 0.2rem 0.5rem;
            border-radius: 4px;
            font-size: 0.75rem;
            font-weight: 500;
        }

        .project-type.case-study {
            background: rgba(59, 130, 246, 0.1);
            color: #93c5fd;
        }

        .hardcoded-tag {
            background: rgba(245, 158, 11, 0.2);
            color: #fbbf24;
            padding: 0.2rem 0.5rem;
            border-radius: 4px;
            font-size: 0.75rem;
            font-weight: 500;
            margin-left: 0.5rem;
        }

        .project-actions {
            display: flex;
            gap: 0.5rem;
        }

        .empty-state {
            text-align: center;
            padding: 3rem;
            color: #6b7280;
        }

        .empty-state h3 {
            font-size: 1.2rem;
            margin-bottom: 0.5rem;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            z-index: 1000;
            backdrop-filter: blur(5px);
        }

        .modal-content {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: #1a1a1a;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 2rem;
            max-width: 400px;
            width: 90%;
        }

        .modal h3 {
            margin-bottom: 1rem;
            color: #ffffff;
        }

        .modal p {
            color: #d1d5db;
            margin-bottom: 2rem;
        }

        .modal-actions {
            display: flex;
            gap: 1rem;
            justify-content: flex-end;
        }

        .loading {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: #ffffff;
            animation: spin 1s ease-in-out infinite;
            margin-right: 0.5rem;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        @media (max-width: 768px) {
            .header {
                padding: 1rem;
                flex-direction: column;
                gap: 1rem;
            }

            .container {
                padding: 1rem;
            }

            .stats-grid {
                grid-template-columns: 1fr;
            }

            .project-card {
                grid-template-columns: 1fr;
                text-align: center;
            }

            .project-actions {
                justify-content: center;
            }
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="logo">
            <h1>DESCALCO MEDIA</h1>
        </div>
        <div class="header-actions">
            <a href="add-project.html" class="btn btn-primary">+ Add Project</a>
            <a href="analytics.html" class="btn btn-secondary">📊 Analytics</a>
            <a href="media-manager.html" class="btn btn-secondary">🎬 Media</a>
            <button onclick="logout()" class="btn btn-secondary">Logout</button>
        </div>
    </div>

    <div class="container">
        <div class="stats-grid">
            <div class="stat-card">
                <h3>Total Projects</h3>
                <div class="value" id="totalProjects">0</div>
            </div>
            <div class="stat-card">
                <h3>Simple Projects</h3>
                <div class="value" id="simpleProjects">0</div>
            </div>
            <div class="stat-card">
                <h3>Case Studies</h3>
                <div class="value" id="caseStudies">0</div>
            </div>
            <div class="stat-card">
                <h3>Featured Projects</h3>
                <div class="value" id="featuredProjects">0</div>
            </div>
        </div>

        <div class="projects-section">
            <div class="section-header">
                <h2>All Projects</h2>
                <button onclick="refreshProjects()" class="btn btn-secondary">Refresh</button>
            </div>
            
            <div id="projectsContainer">
                <div class="empty-state">
                    <h3>Loading projects...</h3>
                    <div class="loading"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- Delete Confirmation Modal -->
    <div id="deleteModal" class="modal">
        <div class="modal-content">
            <h3>Delete Project</h3>
            <p>Are you sure you want to delete this project? This action cannot be undone.</p>
            <div class="modal-actions">
                <button onclick="closeDeleteModal()" class="btn btn-secondary">Cancel</button>
                <button onclick="confirmDelete()" class="btn btn-danger">Delete</button>
            </div>
        </div>
    </div>

    <script>
        let projects = [];
        let projectToDelete = null;

        // Load projects on page load
        document.addEventListener('DOMContentLoaded', () => {
            loadProjects();
        });

        async function loadProjects() {
            try {
                const response = await fetch('/api/projects');
                if (!response.ok) {
                    if (response.status === 401) {
                        window.location.href = '/';
                        return;
                    }
                    throw new Error('Failed to load projects');
                }
                
                projects = await response.json();
                updateStats();
                renderProjects();
            } catch (error) {
                console.error('Error loading projects:', error);
                document.getElementById('projectsContainer').innerHTML = `
                    <div class="empty-state">
                        <h3>Error loading projects</h3>
                        <p>${error.message}</p>
                    </div>
                `;
            }
        }

        function updateStats() {
            const total = projects.length;
            const simple = projects.filter(p => p.projectType === 'simple').length;
            const caseStudies = projects.filter(p => p.projectType === 'case-study').length;
            const featured = projects.filter(p => p.featured).length;

            document.getElementById('totalProjects').textContent = total;
            document.getElementById('simpleProjects').textContent = simple;
            document.getElementById('caseStudies').textContent = caseStudies;
            document.getElementById('featuredProjects').textContent = featured;
        }

        function renderProjects() {
            const container = document.getElementById('projectsContainer');
            
            if (projects.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <h3>No projects yet</h3>
                        <p>Start by adding your first project!</p>
                        <a href="/add-project" class="btn btn-primary">+ Add Project</a>
                    </div>
                `;
                return;
            }

            const projectsHTML = projects.map(project => `
                <div class="project-card">
                    <div class="project-media-preview">
                        ${project.coverMedia 
                            ? project.coverMedia.type === 'video' 
                                ? '🎥' 
                                : '🖼️'
                            : '📄'
                        }
                    </div>
                    <div class="project-info">
                        <h3>${project.title}</h3>
                        <div class="project-meta">
                            <span>${project.year}</span>
                            <span>${project.category}</span>
                            <span class="project-type ${project.projectType === 'case-study' ? 'case-study' : ''}">${project.projectType}</span>
                            ${project.featured ? '<span>⭐ Featured</span>' : ''}
                            ${project.source === 'hardcoded' ? '<span class="hardcoded-tag">(hardcoded)</span>' : ''}
                        </div>
                    </div>
                    <div class="project-actions">
                        ${project.source === 'hardcoded' ? 
                            '<span style="color: #fbbf24; font-size: 0.8rem;">Read-only</span>' : 
                            '<button onclick="editProject(\'' + project.id + '\')" class="btn btn-secondary">Edit</button>'
                        }
                        <button onclick="deleteProject('${project.id}')" class="btn btn-danger">Delete</button>
                    </div>
                </div>
            `).join('');

            container.innerHTML = `<div class="projects-grid">${projectsHTML}</div>`;
        }

        function editProject(id) {
            window.location.href = `/edit-project?id=${id}`;
        }

        function deleteProject(id) {
            projectToDelete = id;
            document.getElementById('deleteModal').style.display = 'block';
        }

        function closeDeleteModal() {
            document.getElementById('deleteModal').style.display = 'none';
            projectToDelete = null;
        }

        async function confirmDelete() {
            if (!projectToDelete) return;

            try {
                const response = await fetch(`/api/projects/${projectToDelete}`, {
                    method: 'DELETE'
                });

                if (!response.ok) {
                    throw new Error('Failed to delete project');
                }

                closeDeleteModal();
                await loadProjects(); // Refresh the list
            } catch (error) {
                console.error('Error deleting project:', error);
                alert('Failed to delete project: ' + error.message);
            }
        }

        async function refreshProjects() {
            await loadProjects();
        }

        async function logout() {
            try {
                await fetch('/api/logout', { method: 'POST' });
                window.location.href = '/';
            } catch (error) {
                console.error('Logout error:', error);
                window.location.href = '/';
            }
        }

        // Close modal when clicking outside
        document.getElementById('deleteModal').addEventListener('click', (e) => {
            if (e.target.id === 'deleteModal') {
                closeDeleteModal();
            }
        });
    </script>
</body>
</html>
