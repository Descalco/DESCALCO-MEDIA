<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Media Manager - Descalco Media Backoffice</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: #0a0a0a;
            color: #ffffff;
            line-height: 1.6;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 2rem;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 3rem;
            padding-bottom: 1rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .logo {
            font-size: 1.5rem;
            font-weight: 700;
            color: #dc2626;
        }

        .nav-links {
            display: flex;
            gap: 2rem;
        }

        .nav-links a {
            color: #a1a1aa;
            text-decoration: none;
            font-weight: 500;
            transition: color 0.3s ease;
        }

        .nav-links a:hover,
        .nav-links a.active {
            color: #ffffff;
        }

        .back-button {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #ffffff;
            padding: 0.75rem 1.5rem;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 500;
            transition: all 0.3s ease;
        }

        .back-button:hover {
            background: #dc2626;
            border-color: #dc2626;
        }

        .section-title {
            font-size: 1.5rem;
            font-weight: 600;
            margin-bottom: 2rem;
            color: #ffffff;
        }

        .upload-section {
            background: rgba(255, 255, 255, 0.05);
            border: 2px dashed rgba(255, 255, 255, 0.2);
            border-radius: 12px;
            padding: 3rem;
            text-align: center;
            margin-bottom: 3rem;
            transition: all 0.3s ease;
        }

        .upload-section:hover {
            border-color: rgba(220, 38, 38, 0.5);
            background: rgba(220, 38, 38, 0.05);
        }

        .upload-section.dragover {
            border-color: #dc2626;
            background: rgba(220, 38, 38, 0.1);
        }

        .upload-icon {
            font-size: 3rem;
            color: #dc2626;
            margin-bottom: 1rem;
        }

        .upload-text {
            font-size: 1.1rem;
            color: #a1a1aa;
            margin-bottom: 1rem;
        }

        .upload-button {
            background: #dc2626;
            color: #ffffff;
            border: none;
            padding: 0.75rem 2rem;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.3s ease;
        }

        .upload-button:hover {
            background: #b91c1c;
        }

        .file-input {
            display: none;
        }

        .filters {
            display: flex;
            gap: 1rem;
            margin-bottom: 2rem;
            flex-wrap: wrap;
        }

        .filter-button {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #ffffff;
            padding: 0.5rem 1rem;
            border-radius: 20px;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .filter-button:hover,
        .filter-button.active {
            background: #dc2626;
            border-color: #dc2626;
        }

        .media-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 1.5rem;
        }

        .media-item {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            overflow: hidden;
            transition: all 0.3s ease;
            position: relative;
        }

        .media-item:hover {
            transform: translateY(-5px);
            border-color: rgba(220, 38, 38, 0.3);
        }

        .media-preview {
            width: 100%;
            height: 200px;
            object-fit: cover;
            background: rgba(255, 255, 255, 0.02);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #a1a1aa;
        }

        .media-info {
            padding: 1rem;
        }

        .media-name {
            font-weight: 500;
            margin-bottom: 0.5rem;
            word-break: break-all;
        }

        .media-details {
            font-size: 0.8rem;
            color: #a1a1aa;
            margin-bottom: 0.5rem;
        }

        .media-actions {
            display: flex;
            gap: 0.5rem;
        }

        .action-button {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #ffffff;
            padding: 0.25rem 0.5rem;
            border-radius: 4px;
            font-size: 0.8rem;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .action-button:hover {
            background: #dc2626;
            border-color: #dc2626;
        }

        .action-button.delete {
            background: rgba(239, 68, 68, 0.2);
            border-color: rgba(239, 68, 68, 0.3);
            color: #fca5a5;
        }

        .action-button.delete:hover {
            background: #dc2626;
            border-color: #dc2626;
            color: #ffffff;
        }

        .upload-progress {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.9);
            padding: 2rem;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            display: none;
            z-index: 1000;
        }

        .progress-bar {
            width: 300px;
            height: 8px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 4px;
            overflow: hidden;
            margin-top: 1rem;
        }

        .progress-fill {
            height: 100%;
            background: #dc2626;
            width: 0%;
            transition: width 0.3s ease;
        }

        .empty-state {
            text-align: center;
            padding: 4rem 2rem;
            color: #a1a1aa;
        }

        .empty-icon {
            font-size: 4rem;
            margin-bottom: 1rem;
            opacity: 0.5;
        }

        @media (max-width: 768px) {
            .container {
                padding: 1rem;
            }

            .header {
                flex-direction: column;
                gap: 1rem;
                text-align: center;
            }

            .nav-links {
                flex-wrap: wrap;
                justify-content: center;
            }

            .media-grid {
                grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
                gap: 1rem;
            }

            .upload-section {
                padding: 2rem 1rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="logo">DESCALCO MEDIA</div>
            <nav class="nav-links">
                <a href="dashboard.html">Dashboard</a>
                <a href="add-project.html">Add Project</a>
                <a href="analytics.html">Analytics</a>
                <a href="media-manager.html" class="active">Media Manager</a>
            </nav>
            <a href="dashboard.html" class="back-button">← Back to Dashboard</a>
        </div>

        <h1 class="section-title">Media Manager</h1>

        <div class="upload-section" id="uploadSection">
            <div class="upload-icon">📁</div>
            <div class="upload-text">Drag and drop files here or click to browse</div>
            <button class="upload-button" onclick="document.getElementById('fileInput').click()">
                Choose Files
            </button>
            <input type="file" id="fileInput" class="file-input" multiple accept="image/*,video/*">
        </div>

        <div class="filters">
            <button class="filter-button active" data-filter="all">All Files</button>
            <button class="filter-button" data-filter="images">Images</button>
            <button class="filter-button" data-filter="videos">Videos</button>
            <button class="filter-button" data-filter="recent">Recent</button>
        </div>

        <div class="media-grid" id="mediaGrid">
            <!-- Media items will be loaded here -->
        </div>

        <div class="empty-state" id="emptyState" style="display: none;">
            <div class="empty-icon">📂</div>
            <h3>No media files found</h3>
            <p>Upload some images or videos to get started</p>
        </div>
    </div>

    <div class="upload-progress" id="uploadProgress">
        <div>Uploading files...</div>
        <div class="progress-bar">
            <div class="progress-fill" id="progressFill"></div>
        </div>
        <div id="progressText">0%</div>
    </div>

    <script>
        let currentFilter = 'all';
        let mediaFiles = [];

        // Initialize media manager
        async function initMediaManager() {
            await loadMediaFiles();
            setupEventListeners();
        }

        // Load media files from server
        async function loadMediaFiles() {
            try {
                // For now, we'll simulate media files since the backend doesn't have this endpoint yet
                // In a real implementation, this would fetch from /api/media
                mediaFiles = [
                    {
                        id: 1,
                        name: 'SOF-WEEK.mp4',
                        type: 'video',
                        size: '15.2 MB',
                        path: 'assets/img/OUTROS/SOF-WEEK.mp4',
                        uploadDate: '2025-01-15'
                    },
                    {
                        id: 2,
                        name: 'GUISADO-VIDEO.mp4',
                        type: 'video',
                        size: '28.7 MB',
                        path: 'assets/img/OUTROS/GUISADO-VIDEO.mp4',
                        uploadDate: '2025-01-10'
                    },
                    {
                        id: 3,
                        name: 'DESISTIR-CAPA2.jpg',
                        type: 'image',
                        size: '2.1 MB',
                        path: 'assets/img/DESISTIR/DESISTIR-CAPA2.jpg',
                        uploadDate: '2024-12-20'
                    }
                ];
                
                renderMediaGrid();
            } catch (error) {
                console.error('Error loading media files:', error);
                showEmptyState();
            }
        }

        // Render media grid
        function renderMediaGrid() {
            const mediaGrid = document.getElementById('mediaGrid');
            const emptyState = document.getElementById('emptyState');
            
            let filteredFiles = mediaFiles;
            
            // Apply filters
            if (currentFilter !== 'all') {
                if (currentFilter === 'images') {
                    filteredFiles = mediaFiles.filter(file => file.type === 'image');
                } else if (currentFilter === 'videos') {
                    filteredFiles = mediaFiles.filter(file => file.type === 'video');
                } else if (currentFilter === 'recent') {
                    filteredFiles = mediaFiles.filter(file => {
                        const uploadDate = new Date(file.uploadDate);
                        const weekAgo = new Date();
                        weekAgo.setDate(weekAgo.getDate() - 7);
                        return uploadDate > weekAgo;
                    });
                }
            }

            if (filteredFiles.length === 0) {
                mediaGrid.style.display = 'none';
                emptyState.style.display = 'block';
                return;
            }

            mediaGrid.style.display = 'grid';
            emptyState.style.display = 'none';

            mediaGrid.innerHTML = filteredFiles.map(file => `
                <div class="media-item">
                    <div class="media-preview">
                        ${file.type === 'image' ? 
                            `<img src="../${file.path}" alt="${file.name}" style="width: 100%; height: 100%; object-fit: cover;">` :
                            `<div style="font-size: 3rem;">🎬</div>`
                        }
                    </div>
                    <div class="media-info">
                        <div class="media-name">${file.name}</div>
                        <div class="media-details">
                            ${file.size} • ${file.type} • ${file.uploadDate}
                        </div>
                        <div class="media-actions">
                            <button class="action-button" onclick="copyPath('${file.path}')">Copy Path</button>
                            <button class="action-button" onclick="viewFile('${file.path}')">View</button>
                            <button class="action-button delete" onclick="deleteFile(${file.id})">Delete</button>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        // Setup event listeners
        function setupEventListeners() {
            // File input change
            document.getElementById('fileInput').addEventListener('change', handleFileUpload);

            // Drag and drop
            const uploadSection = document.getElementById('uploadSection');
            uploadSection.addEventListener('dragover', handleDragOver);
            uploadSection.addEventListener('dragleave', handleDragLeave);
            uploadSection.addEventListener('drop', handleDrop);

            // Filter buttons
            document.querySelectorAll('.filter-button').forEach(button => {
                button.addEventListener('click', (e) => {
                    document.querySelectorAll('.filter-button').forEach(b => b.classList.remove('active'));
                    e.target.classList.add('active');
                    currentFilter = e.target.dataset.filter;
                    renderMediaGrid();
                });
            });
        }

        // Handle file upload
        function handleFileUpload(event) {
            const files = Array.from(event.target.files);
            uploadFiles(files);
        }

        // Handle drag over
        function handleDragOver(event) {
            event.preventDefault();
            event.currentTarget.classList.add('dragover');
        }

        // Handle drag leave
        function handleDragLeave(event) {
            event.currentTarget.classList.remove('dragover');
        }

        // Handle drop
        function handleDrop(event) {
            event.preventDefault();
            event.currentTarget.classList.remove('dragover');
            const files = Array.from(event.dataTransfer.files);
            uploadFiles(files);
        }

        // Upload files
        async function uploadFiles(files) {
            if (files.length === 0) return;

            const uploadProgress = document.getElementById('uploadProgress');
            const progressFill = document.getElementById('progressFill');
            const progressText = document.getElementById('progressText');

            uploadProgress.style.display = 'block';

            for (let i = 0; i < files.length; i++) {
                const file = files[i];
                const progress = ((i + 1) / files.length) * 100;
                
                progressFill.style.width = progress + '%';
                progressText.textContent = Math.round(progress) + '%';

                // Simulate upload delay
                await new Promise(resolve => setTimeout(resolve, 1000));

                // Add to media files (in real implementation, this would be handled by the server)
                const newFile = {
                    id: Date.now() + i,
                    name: file.name,
                    type: file.type.startsWith('image/') ? 'image' : 'video',
                    size: formatFileSize(file.size),
                    path: `uploads/${file.name}`,
                    uploadDate: new Date().toISOString().split('T')[0]
                };
                
                mediaFiles.unshift(newFile);
            }

            uploadProgress.style.display = 'none';
            renderMediaGrid();
            
            // Reset file input
            document.getElementById('fileInput').value = '';
        }

        // Format file size
        function formatFileSize(bytes) {
            if (bytes === 0) return '0 Bytes';
            const k = 1024;
            const sizes = ['Bytes', 'KB', 'MB', 'GB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return parseFloat((bytes / Math.pow(k, i)).toFixed(1)) + ' ' + sizes[i];
        }

        // Copy file path to clipboard
        function copyPath(path) {
            navigator.clipboard.writeText(path).then(() => {
                alert('Path copied to clipboard!');
            });
        }

        // View file
        function viewFile(path) {
            window.open('../' + path, '_blank');
        }

        // Delete file
        function deleteFile(id) {
            if (confirm('Are you sure you want to delete this file?')) {
                mediaFiles = mediaFiles.filter(file => file.id !== id);
                renderMediaGrid();
            }
        }

        // Show empty state
        function showEmptyState() {
            document.getElementById('mediaGrid').style.display = 'none';
            document.getElementById('emptyState').style.display = 'block';
        }

        // Initialize on page load
        initMediaManager();
    </script>
</body>
</html>
