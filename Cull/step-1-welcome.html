<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CullPro - Welcome</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            width: 100%;
        }

        :root {
            --background: #373737;
            --background-dark: #2a2a2a;
            --foreground: #eaeaea;
            --primary: #ffdd00;
            --primary-foreground: #313131;
            --muted-foreground: #c4c4c4;
            --border: #525252;
        }

        html {
            font-size: 16px;
        }

        body {
            background-color: var(--background);
            color: var(--foreground);
            font-family: 'Montserrat', sans-serif;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .progress-bar {
            height: 4px;
            background: var(--primary);
            width: 0%;
            transition: width 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .slide-wrapper {
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        .slide-content {
            flex: 1;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0;
            animation: fadeIn 0.5s ease-in;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }

        .welcome-content {
            background: var(--background-dark);
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 4rem 3rem;
        }

        .welcome-visual {
            background: #d41f2a;
            position: relative;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .welcome-visual-icon {
            font-size: 6rem;
            color: var(--primary);
            opacity: 0.3;
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-20px); }
        }

        .pill-badge {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            background: rgba(255, 221, 0, 0.1);
            border: 1px solid rgba(255, 221, 0, 0.3);
            padding: 0.5rem 1rem;
            border-radius: 2rem;
            color: var(--primary);
            font-size: 0.85rem;
            font-weight: 600;
            margin-bottom: 2rem;
            width: fit-content;
        }

        .welcome-headline {
            font-size: 3.5rem;
            font-weight: 600;
            line-height: 1.2;
            margin-bottom: 1.5rem;
            color: var(--foreground);
        }

        .welcome-subtext {
            color: var(--muted-foreground);
            line-height: 1.6;
            margin-bottom: 2.5rem;
            font-size: 1rem;
        }

        .welcome-subtext strong {
            color: var(--primary);
            font-weight: 600;
        }

        .btn {
            padding: 0.85rem 1.75rem;
            border: none;
            border-radius: 0.625rem;
            font-family: 'Montserrat', sans-serif;
            font-weight: 600;
            cursor: pointer;
            font-size: 1rem;
            transition: all 0.2s;
            width: fit-content;
            text-decoration: none;
            display: inline-block;
            text-align: center;
        }

        .btn-primary {
            background: var(--primary);
            color: var(--primary-foreground);
        }

        .btn-primary:hover {
            background: #e5c200;
            transform: translateY(-2px);
            box-shadow: 0 8px 16px rgba(255, 221, 0, 0.2);
        }

        .bottom-nav {
            height: 97px;
            background: #313131;
            border-top: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 3rem;
        }

        .nav-button {
            background: none;
            border: none;
            color: var(--foreground);
            font-family: 'Montserrat', sans-serif;
            font-size: 1rem;
            cursor: pointer;
            padding: 0.75rem 1.5rem;
            transition: all 0.2s;
            font-weight: 500;
            text-decoration: none;
            display: inline-block;
        }

        .nav-button:hover:not(:disabled) {
            color: var(--primary);
            transform: translateX(4px);
        }

        .nav-button:disabled {
            color: #6d6d6d;
            cursor: not-allowed;
            opacity: 0.5;
        }

        .nav-button.back {
            margin-left: -1.5rem;
            visibility: hidden;
        }

        .nav-step {
            color: var(--muted-foreground);
            font-size: 0.95rem;
            font-weight: 500;
        }

        .nav-continue {
            background: var(--primary);
            color: var(--primary-foreground);
            margin-right: -1.5rem;
            padding-right: 2rem;
            padding-left: 2rem;
            border-radius: 0.625rem;
        }

        .nav-continue:hover {
            background: #e5c200;
        }

        @media (max-width: 1024px) {
            .slide-content {
                grid-template-columns: 1fr;
            }

            .welcome-headline {
                font-size: 2.5rem;
            }
        }
    </style>
</head>
<body>
    <div class="progress-bar"></div>

    <div class="slide-wrapper">
        <div class="slide-content">
            <div class="welcome-content">
                <div class="pill-badge">👋 Welcome to CullPro</div>
                <h1 class="welcome-headline">Your perfect<br>culling workflow<br>starts here</h1>
                <p class="welcome-subtext">
                    <strong>7 quick questions</strong> to personalize your experience.<br>
                    <strong>Takes less than 2 minutes.</strong>
                </p>
                <a href="step-2-photography.html" class="btn btn-primary">Get Started →</a>
            </div>
            <div class="welcome-visual">
                <div class="welcome-visual-icon">⚡</div>
            </div>
        </div>
    </div>

    <div class="bottom-nav">
        <span class="nav-button back">‹ Back</span>
        <div class="nav-step">Welcome</div>
        <a href="step-2-photography.html" class="nav-button nav-continue">Continue →</a>
    </div>

    <script>
        // Initialize session data
        if (!sessionStorage.getItem('cullpro-onboarding')) {
            sessionStorage.setItem('cullpro-onboarding', JSON.stringify({
                photography: [],
                rating: null,
                experience: null,
                keyboard: null,
                autoReject: false,
                minRating: 3
            }));
        }

        // Update progress bar
        document.querySelector('.progress-bar').style.width = '0%';
    </script>
</body>
</html>
