<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AlbumTeller - Import</title>
    <link rel="stylesheet" href="styles/main-styles.css">
</head>
<body class="upload-page">
    <header class="upload-header">
        <a href="home.html" class="upload-back" aria-label="Go back to projects" data-node-id="38:2596">
            <span class="upload-back-icon">←</span>
            <span class="upload-back-text">Back</span>
        </a>
        <div class="upload-chip" data-node-id="38:2649">
            <span class="upload-chip-text">Title - album</span>
            <button class="upload-chip-close" type="button" aria-label="Close title chip">×</button>
        </div>
    </header>

    <main class="upload-main" data-node-id="38:2601">
        <section class="upload-card" aria-labelledby="upload-heading">
            <div class="upload-card-body">
                <div class="upload-icon" data-node-id="38:2606">
                    <img src="http://localhost:3845/assets/a3962592c9a1aef38a39139b87321f8dc7a6aae2.svg" alt="Folder icon" loading="lazy">
                </div>

                <div class="upload-heading" id="upload-heading" data-node-id="38:2616">Import Your Photos</div>
                <p class="upload-subtitle" data-node-id="38:2618">Select a folder or drag and drop to begin culling</p>

                <a class="upload-cta" href="#" id="choose-folder" data-node-id="38:2620">
                    <span class="upload-cta-icon">
                        <img src="http://localhost:3845/assets/db3a3963dfa71cd8718a171370d66a4bd6963905.svg" alt="Folder" loading="lazy">
                    </span>
                    <span class="upload-cta-text">Choose Folder</span>
                </a>

                <div class="upload-supported" data-node-id="38:2626">Supported Formats</div>
                <div class="upload-formats" aria-label="Supported formats">
                    <span class="upload-chip-pill">RAW</span>
                    <span class="upload-chip-pill">JPEG</span>
                    <span class="upload-chip-pill">TIFF</span>
                    <span class="upload-chip-pill">CR2</span>
                    <span class="upload-chip-pill">NEF</span>
                    <span class="upload-chip-pill">ARW</span>
                    <span class="upload-chip-pill">DNG</span>
                </div>
            </div>
        </section>
    </main>

        <div class="demo-modal hidden" id="demo-modal" role="dialog" aria-modal="true" aria-labelledby="demo-modal-title">
                <div class="demo-modal-backdrop" id="demo-modal-backdrop"></div>
                <div class="demo-modal-card">
                        <h2 class="demo-modal-title" id="demo-modal-title">This is just a demo</h2>
                        <p class="demo-modal-text">Folder selection is not wired here yet. Continue to the project view to see the workstation layout.</p>
                        <div class="demo-modal-actions">
                                <button class="demo-btn secondary" type="button" id="demo-close">Close</button>
                                <a class="demo-btn primary" href="cull.html">Go to Project View</a>
                        </div>
                </div>
        </div>

        <script>
            (function () {
                var chooseBtn = document.getElementById('choose-folder');
                var modal = document.getElementById('demo-modal');
                var closeBtn = document.getElementById('demo-close');
                var backdrop = document.getElementById('demo-modal-backdrop');

                function openModal(event) {
                    event.preventDefault();
                    modal.classList.remove('hidden');
                }

                function closeModal() {
                    modal.classList.add('hidden');
                }

                if (chooseBtn && modal) {
                    chooseBtn.addEventListener('click', openModal);
                }

                if (closeBtn) {
                    closeBtn.addEventListener('click', closeModal);
                }

                if (backdrop) {
                    backdrop.addEventListener('click', closeModal);
                }
            })();
        </script>
</body>
</html>
