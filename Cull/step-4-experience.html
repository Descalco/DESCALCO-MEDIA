<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CullPro - Experience Level</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --background: #373737;
            --background-warm: #4a3a38;
            --foreground: #eaeaea;
            --primary: #ffdd00;
            --primary-foreground: #313131;
            --muted-foreground: #c4c4c4;
            --border: #525252;
        }

        html {
            font-size: 16px;
        }

        body {
            background-color: var(--background);
            color: var(--foreground);
            font-family: 'Montserrat', sans-serif;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .progress-bar {
            height: 4px;
            background: var(--primary);
            width: 0%;
            transition: width 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .slide-wrapper {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            position: relative;
        }

        .background-blur {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #ff6f6f;
            opacity: 0.2;
            filter: blur(100px);
            z-index: 0;
        }

        .slide-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 3rem;
            animation: fadeIn 0.5s ease-in;
            position: relative;
            z-index: 1;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }

        .question-container {
            max-width: 600px;
            width: 100%;
            text-align: center;
        }

        .progress-label {
            color: var(--primary);
            font-size: 0.85rem;
            font-weight: 600;
            letter-spacing: 0.5px;
            margin-bottom: 1.5rem;
        }

        .question-title {
            font-size: 3rem;
            font-weight: 500;
            color: var(--foreground);
            margin-bottom: 1rem;
            line-height: 1.2;
        }

        .question-subtitle {
            color: var(--muted-foreground);
            font-size: 1.125rem;
            margin-bottom: 2.5rem;
            line-height: 1.75rem;
        }

        .options-list {
            display: flex;
            flex-direction: column;
            gap: 1rem;
            margin-top: 2rem;
            text-align: left;
        }

        .option-button {
            padding: 1.25rem;
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 0.625rem;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            color: var(--muted-foreground);
            font-weight: 500;
            font-size: 0.95rem;
            font-family: 'Montserrat', sans-serif;
        }

        .option-button:hover {
            border-color: rgba(255, 255, 255, 0.2);
            background: rgba(0, 0, 0, 0.3);
            transform: translateX(4px);
        }

        .option-button.selected {
            background: var(--primary);
            border-color: var(--primary);
            color: var(--primary-foreground);
            box-shadow: 0 8px 24px rgba(255, 221, 0, 0.2);
        }

        .bottom-nav {
            height: 97px;
            background: #313131;
            border-top: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 3rem;
            flex-shrink: 0;
        }

        .nav-button {
            background: none;
            border: none;
            color: var(--foreground);
            font-family: 'Montserrat', sans-serif;
            font-size: 1rem;
            cursor: pointer;
            padding: 0.75rem 1.5rem;
            transition: all 0.2s;
            font-weight: 500;
            text-decoration: none;
            display: inline-block;
        }

        .nav-button:hover:not(:disabled) {
            color: var(--primary);
            transform: translateX(-4px);
        }

        .nav-button:disabled {
            color: #6d6d6d;
            cursor: not-allowed;
            opacity: 0.5;
        }

        .nav-button.back {
            margin-left: -1.5rem;
        }

        .nav-step {
            color: var(--muted-foreground);
            font-size: 0.95rem;
            font-weight: 500;
        }

        .nav-continue {
            background: var(--primary);
            color: var(--primary-foreground);
            margin-right: -1.5rem;
            padding-right: 2rem;
            padding-left: 2rem;
            border-radius: 0.625rem;
        }

        .nav-continue:hover:not(:disabled) {
            background: #e5c200;
        }

        .nav-continue:disabled {
            background: var(--border);
            cursor: not-allowed;
        }
    </style>
</head>
<body>
    <div class="progress-bar"></div>

    <div class="slide-wrapper">
        <div class="background-blur"></div>
        <div class="slide-content">
            <div class="question-container">
                <div class="progress-label">Question 3 of 5</div>
                <h2 class="question-title">Experience level</h2>
                <p class="question-subtitle">How long have you been photographing?</p>
                
                <div class="options-list">
                    <button type="button" class="option-button" data-value="beginner" onclick="selectOption(this)">👶 Beginner (0-2 years)</button>
                    <button type="button" class="option-button" data-value="intermediate" onclick="selectOption(this)">📸 Intermediate (2-5 years)</button>
                    <button type="button" class="option-button" data-value="advanced" onclick="selectOption(this)">🎯 Advanced (5-10 years)</button>
                    <button type="button" class="option-button" data-value="professional" onclick="selectOption(this)">🏆 Professional (10+ years)</button>
                </div>
            </div>
        </div>
    </div>

    <div class="bottom-nav">
        <a href="step-3-rating.html" class="nav-button back">‹ Back</a>
        <div class="nav-step">3 of 5</div>
        <button id="continueBtn" class="nav-button nav-continue" disabled onclick="continueToNext()">Continue →</button>
    </div>

    <script>
        let data = JSON.parse(sessionStorage.getItem('cullpro-onboarding')) || {};

        function selectOption(element) {
            document.querySelectorAll('.option-button').forEach(btn => {
                btn.classList.remove('selected');
            });
            element.classList.add('selected');
            data.experience = element.dataset.value;
            document.getElementById('continueBtn').disabled = false;
            sessionStorage.setItem('cullpro-onboarding', JSON.stringify(data));
        }

        function continueToNext() {
            window.location.href = 'step-5-filters.html';
        }

        // Load saved data
        window.addEventListener('load', () => {
            document.querySelector('.progress-bar').style.width = '60%';
            
            if (data.experience) {
                document.querySelector(`[data-value="${data.experience}"]`).classList.add('selected');
                document.getElementById('continueBtn').disabled = false;
            }
        });
    </script>
</body>
</html>
