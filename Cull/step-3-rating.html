<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CullPro - Rating System</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --background: #373737;
            --background-dark: #2a2a2a;
            --foreground: #eaeaea;
            --primary: #ffdd00;
            --primary-foreground: #313131;
            --muted-foreground: #c4c4c4;
            --border: #525252;
        }

        html {
            font-size: 16px;
        }

        body {
            background-color: var(--background);
            color: var(--foreground);
            font-family: 'Montserrat', sans-serif;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .progress-bar {
            height: 4px;
            background: var(--primary);
            width: 0%;
            transition: width 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .slide-wrapper {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            position: relative;
        }

        .background-blur {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #ff6f6f;
            opacity: 0.2;
            filter: blur(100px);
            z-index: 0;
        }

        .slide-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 3rem;
            animation: fadeIn 0.5s ease-in;
            position: relative;
            z-index: 1;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }

        .question-container {
            max-width: 900px;
            width: 100%;
            text-align: center;
        }

        .progress-label {
            color: var(--primary);
            font-size: 0.85rem;
            font-weight: 600;
            letter-spacing: 0.5px;
            margin-bottom: 1.5rem;
        }

        .question-title {
            font-size: 3rem;
            font-weight: 500;
            color: var(--foreground);
            margin-bottom: 1rem;
            line-height: 1.2;
        }

        .question-subtitle {
            color: var(--muted-foreground);
            font-size: 1.125rem;
            margin-bottom: 2.5rem;
            line-height: 1.75rem;
        }

        .rating-cards {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 2rem;
            margin-top: 2.5rem;
        }

        .rating-card {
            padding: 2.5rem 2rem;
            background: rgba(0, 0, 0, 0.3);
            border: 2px solid rgba(255, 255, 255, 0.1);
            border-radius: 0.625rem;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            text-align: center;
            min-height: 240px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .rating-card:hover {
            border-color: rgba(255, 255, 255, 0.2);
            background: rgba(0, 0, 0, 0.4);
            transform: translateY(-4px);
        }

        .rating-card.selected {
            background: var(--primary);
            border-color: var(--primary);
            color: var(--primary-foreground);
            box-shadow: 0 16px 40px rgba(255, 221, 0, 0.25);
            transform: scale(1.02);
        }

        .rating-icon {
            font-size: 3rem;
            margin-bottom: 1rem;
            color: var(--primary);
            transition: transform 0.3s;
        }

        .rating-card:hover .rating-icon {
            transform: scale(1.1);
        }

        .rating-card.selected .rating-icon {
            color: var(--primary-foreground);
        }

        .rating-label {
            font-size: 1.25rem;
            font-weight: 600;
            color: var(--foreground);
            margin-bottom: 0.5rem;
        }

        .rating-card.selected .rating-label {
            color: var(--primary-foreground);
        }

        .rating-desc {
            font-size: 0.9rem;
            color: var(--muted-foreground);
        }

        .rating-card.selected .rating-desc {
            color: rgba(49, 49, 49, 0.7);
        }

        .bottom-nav {
            height: 97px;
            background: #313131;
            border-top: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 3rem;
            flex-shrink: 0;
        }

        .nav-button {
            background: none;
            border: none;
            color: var(--foreground);
            font-family: 'Montserrat', sans-serif;
            font-size: 1rem;
            cursor: pointer;
            padding: 0.75rem 1.5rem;
            transition: all 0.2s;
            font-weight: 500;
            text-decoration: none;
            display: inline-block;
        }

        .nav-button:hover:not(:disabled) {
            color: var(--primary);
            transform: translateX(-4px);
        }

        .nav-button:disabled {
            color: #6d6d6d;
            cursor: not-allowed;
            opacity: 0.5;
        }

        .nav-button.back {
            margin-left: -1.5rem;
        }

        .nav-step {
            color: var(--muted-foreground);
            font-size: 0.95rem;
            font-weight: 500;
        }

        .nav-continue {
            background: var(--primary);
            color: var(--primary-foreground);
            margin-right: -1.5rem;
            padding-right: 2rem;
            padding-left: 2rem;
            border-radius: 0.625rem;
        }

        .nav-continue:hover:not(:disabled) {
            background: #e5c200;
        }

        .nav-continue:disabled {
            background: var(--border);
            cursor: not-allowed;
        }

        @media (max-width: 1024px) {
            .rating-cards {
                grid-template-columns: 1fr;
            }
        }

        @media (max-width: 640px) {
            .question-title {
                font-size: 1.8rem;
            }
        }
    </style>
</head>
<body>
    <div class="progress-bar"></div>

    <div class="slide-wrapper">
        <div class="background-blur"></div>
        <div class="slide-content">
            <div class="question-container">
                <div class="progress-label">Question 2 of 5</div>
                <h2 class="question-title">How do you prefer to rate images?</h2>
                <p class="question-subtitle">Choose the system that feels most natural</p>
                
                <div class="rating-cards">
                    <div class="rating-card" data-value="5-star" onclick="selectRating(this)">
                        <div class="rating-icon">⭐</div>
                        <div class="rating-label">5-Star Rating</div>
                        <div class="rating-desc">Lightroom-style</div>
                    </div>
                    <div class="rating-card" data-value="flag" onclick="selectRating(this)">
                        <div class="rating-icon">⚡</div>
                        <div class="rating-label">Flag System</div>
                        <div class="rating-desc">P / Pick, X / Reject</div>
                    </div>
                    <div class="rating-card" data-value="color" onclick="selectRating(this)">
                        <div class="rating-icon">📷</div>
                        <div class="rating-label">Color Labels</div>
                        <div class="rating-desc">Custom colour labels</div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="bottom-nav">
        <a href="step-2-photography.html" class="nav-button back">‹ Back</a>
        <div class="nav-step">2 of 5</div>
        <button id="continueBtn" class="nav-button nav-continue" disabled onclick="continueToNext()">Continue →</button>
    </div>

    <script>
        let data = JSON.parse(sessionStorage.getItem('cullpro-onboarding')) || {};

        function selectRating(element) {
            document.querySelectorAll('.rating-card').forEach(card => {
                card.classList.remove('selected');
            });
            element.classList.add('selected');
            data.rating = element.dataset.value;
            document.getElementById('continueBtn').disabled = false;
            sessionStorage.setItem('cullpro-onboarding', JSON.stringify(data));
        }

        function continueToNext() {
            window.location.href = 'step-4-experience.html';
        }

        // Load saved data
        window.addEventListener('load', () => {
            document.querySelector('.progress-bar').style.width = '40%';
            
            if (data.rating) {
                document.querySelector(`[data-value="${data.rating}"]`).classList.add('selected');
                document.getElementById('continueBtn').disabled = false;
            }
        });
    </script>
</body>
</html>
