<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Portfolio – Descalco Media</title>
  <link rel="stylesheet" href="assets/css/portfolio-unified.css">
  <link rel="stylesheet" href="assets/css/main-enhanced.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    /* Additional styles to ensure consistency */
    .loading-state {
      text-align: center;
      padding: 4rem 2rem;
      color: #888;
    }

    .error-state {
      text-align: center;
      padding: 4rem 2rem;
      color: #ff6b6b;
    }

    .project-item {
      opacity: 0;
      transform: translateY(20px);
      transition: opacity 0.6s ease, transform 0.6s ease;
    }

    .project-item.loaded {
      opacity: 1;
      transform: translateY(0);
    }

    /* Ensure consistent styling for both static and dynamic projects */
    .project-media {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.3s ease;
    }

    .project-item:hover .project-media {
      transform: scale(1.05);
    }

    /* Fix for featured projects */
    .featured-badge {
      position: absolute;
      top: 1rem;
      right: 1rem;
      background: linear-gradient(135deg, #dc2626 0%, #b91c1c 100%);
      color: white;
      padding: 0.25rem 0.75rem;
      border-radius: 20px;
      font-size: 0.75rem;
      font-weight: 600;
      z-index: 10;
    }
  </style>
</head>

<body class="portfolio-enhanced">
  <!-- Animated Background -->
  <div class="animated-bg">
    <div class="floating-shapes">
      <div class="floating-shape"></div>
      <div class="floating-shape"></div>
      <div class="floating-shape"></div>
      <div class="floating-shape"></div>
      <div class="floating-shape"></div>
    </div>
    <canvas id="particleCanvas"></canvas>
  </div>

  <div class="portfolio-container">
    <a class="back-link" href="index.html">← Back to Home</a>

    <div class="portfolio-header enhanced">
      <h1 class="enhanced-title">Portfolio</h1>
      <p class="enhanced-subtitle">A collection of my creative work spanning interactive media, animation, sound design, and digital art. Hover
        over each project to explore the full story behind each creation.</p>
    </div>

    <!-- Loading State -->
    <div id="loading-state" class="loading-state">
      <p>Loading projects...</p>
    </div>

    <!-- Error State -->
    <div id="error-state" class="error-state" style="display: none;">
      <p>Failed to load projects. Please try again later.</p>
      <button onclick="loadProjects()" style="margin-top: 1rem; padding: 0.5rem 1rem; background: #dc2626; color: white; border: none; border-radius: 4px; cursor: pointer;">Retry</button>
    </div>

    <!-- Portfolio Grid -->
    <div class="portfolio-grid" id="portfolio-grid" style="display: none;">
      <!-- Projects will be loaded here dynamically -->
    </div>

    <div style="margin-top: 4rem; text-align: center;">
      <a class="back-link" href="index.html">← Back to Home</a>
    </div>
  </div>

  <script type="module">
    // Import the portfolio data
    import PORTFOLIO_PROJECTS from './assets/js/portfolio-data.js';

    let allProjects = [];

    // Load projects on page load
    document.addEventListener('DOMContentLoaded', function() {
      loadProjects();
    });

    function loadProjects() {
      const loadingState = document.getElementById('loading-state');
      const errorState = document.getElementById('error-state');
      const portfolioGrid = document.getElementById('portfolio-grid');

      try {
        // Show loading state
        loadingState.style.display = 'block';
        errorState.style.display = 'none';
        portfolioGrid.style.display = 'none';

        // Use the imported portfolio projects
        allProjects = PORTFOLIO_PROJECTS.map(project => {
          // Transform the project data to match the expected format
            return {
                id: project.id,
                title: project.title,
                year: project.year,
                category: project.category,
                description: project.description,
                tags: project.tags || [],
                featured: project.featured || false,
                externalLink: project.projectType === 'case-study' ? project.htmlFile : project.externalLink,
                coverMedia: project.coverMedia?.path ? 
                  `backoffice${project.coverMedia.path}` : 
                  project.coverMedia,
                mediaType: project.coverMedia?.type || 
                  (project.coverMedia && project.coverMedia.includes('.mp4') ? 'video' : 'image'),
                displayOrder: project.displayOrder
            };
        });

        // Projects are already sorted by displayOrder in the portfolio-data.js file
        // No need to re-sort here - this preserves the drag-and-drop order from backoffice
        console.log('📋 Loaded projects in backoffice order:', allProjects.map(p => `${p.title} (order: ${p.displayOrder})`));

        // Render projects
        renderProjects(allProjects);

        // Hide loading and show portfolio
        loadingState.style.display = 'none';
        portfolioGrid.style.display = 'grid';

        // Animate projects in
        setTimeout(() => {
          const projectItems = document.querySelectorAll('.project-item');
          projectItems.forEach((item, index) => {
            setTimeout(() => {
              item.classList.add('loaded');
            }, index * 100);
          });
        }, 100);

      } catch (error) {
        console.error('Error loading projects:', error);
        
        // Show error state
        loadingState.style.display = 'none';
        errorState.style.display = 'block';
        portfolioGrid.style.display = 'none';
      }
    }

    // Make loadProjects available globally for the retry button
    window.loadProjects = loadProjects;

    function renderProjects(projects) {
      const portfolioGrid = document.getElementById('portfolio-grid');
      portfolioGrid.innerHTML = '';

      projects.forEach(project => {
        const projectElement = createProjectElement(project);
        portfolioGrid.appendChild(projectElement);
      });
    }

    function createProjectElement(project) {
      const projectDiv = document.createElement('div');
      projectDiv.className = 'project-item';
      projectDiv.style.position = 'relative';

      // Create media element
      let mediaElement;
      const isVideo = project.mediaType === 'video' || 
                     (project.coverMedia && (project.coverMedia.includes('.mp4') || project.coverMedia.includes('.mov')));

      if (isVideo) {
        mediaElement = document.createElement('video');
        mediaElement.className = 'project-media';
        mediaElement.autoplay = true;
        mediaElement.loop = true;
        mediaElement.muted = true;
        mediaElement.playsInline = true;
        
        const source = document.createElement('source');
        source.src = project.coverMedia;
        source.type = 'video/mp4';
        mediaElement.appendChild(source);
      } else {
        mediaElement = document.createElement('img');
        mediaElement.className = 'project-media';
        mediaElement.src = project.coverMedia;
        mediaElement.alt = project.title;
      }

      // Featured badge
      let featuredBadge = '';
      if (project.featured) {
        featuredBadge = '<div class="featured-badge">Featured</div>';
      }

      // Create project HTML
      projectDiv.innerHTML = `
        ${featuredBadge}
        <div class="project-meta">
          <h3>${escapeHtml(project.title)}</h3>
          <div class="project-year">${project.year}</div>
        </div>
        <div class="project-overlay">
          <div class="project-title">${escapeHtml(project.title)}</div>
          <div class="project-description">
            ${escapeHtml(project.description)}
          </div>
          <div class="project-tags">
            ${project.tags.map(tag => `<span class="project-tag">${escapeHtml(tag)}</span>`).join('')}
          </div>
          <a href="${project.externalLink || '#'}" ${project.externalLink && project.externalLink.startsWith('http') ? 'target="_blank"' : ''} class="project-link">View Project</a>
        </div>
      `;

      // Insert media element at the beginning
      projectDiv.insertBefore(mediaElement, projectDiv.firstChild);

      return projectDiv;
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    // Add some mobile-friendly interactions
    if ('ontouchstart' in window) {
      document.addEventListener('touchstart', function() {
        // Enable hover states on mobile
        document.body.classList.add('touch-device');
      });
    }
  </script>

  <script src="assets/js/mobile-portfolio.js"></script>
  <script src="assets/js/portfolio-enhanced.js"></script>
  <script type="module" src="firebase-portfolio-analytics.js"></script>
</body>

</html>
