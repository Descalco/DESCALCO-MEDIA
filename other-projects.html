  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    /* Additional styles to ensure consistency */
    .loading-state {
      text-align: center;
      padding: 4rem 2rem;
      color: #888;
    }

    .error-state {
      text-align: center;
      padding: 4rem 2rem;
      color: #ff6b6b;
    }

    .project-item {
      opacity: 0;
      transform: translateY(20px);
      transition: opacity 0.6s ease, transform 0.6s ease;
    }

    .project-item.loaded {
      opacity: 1;
      transform: translateY(0);
    }

    /* Ensure consistent styling for both static and dynamic projects */
    .project-media {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.3s ease;
    }

    .project-item:hover .project-media {
      transform: scale(1.05);
    }

    /* Fix for featured projects */
    .featured-badge {
      position: absolute;
      top: 1rem;
      right: 1rem;
      background: linear-gradient(135deg, #dc2626 0%, #b91c1c 100%);
      color: white;
      padding: 0.25rem 0.75rem;
      border-radius: 20px;
      font-size: 0.75rem;
      font-weight: 600;
      z-index: 10;
    }
  </style>
</head>

    </div>

      <p>Loading projects...</p>
    </div>

    <!-- Error State -->
    <div id="error-state" class="error-state" style="display: none;">
      <p>Failed to load projects. Please try again later.</p>
      <button onclick="loadProjects()" style="margin-top: 1rem; padding: 0.5rem 1rem; background: #dc2626; color: white; border: none; border-radius: 4px; cursor: pointer;">Retry</button>
    </div>

    <!-- Portfolio Grid -->
    <div class="portfolio-grid" id="portfolio-grid" style="display: none;">
      <!-- Projects will be loaded here dynamically -->
    </div>

    <div style="margin-top: 4rem; text-align: center;">

  </div>

        tags: ['VideoClip', 'Producing', 'Storytelling'],

    let allProjects = [];

    // Load projects on page load
    document.addEventListener('DOMContentLoaded', function() {
      loadProjects();
    });

    async function loadProjects() {
      const loadingState = document.getElementById('loading-state');
      const errorState = document.getElementById('error-state');
      const portfolioGrid = document.getElementById('portfolio-grid');

      try {
        // Show loading state
        loadingState.style.display = 'block';
        errorState.style.display = 'none';
        portfolioGrid.style.display = 'none';

        let dynamicProjects = [];

        // Try to fetch dynamic projects from API
        try {
          const response = await fetch('/api/projects');
          if (response.ok) {
            dynamicProjects = await response.json();
            console.log('Loaded', dynamicProjects.length, 'dynamic projects');
          }
        } catch (apiError) {
          console.log('API not available, using only static projects');
        }

        // Combine static and dynamic projects
        allProjects = [...STATIC_PROJECTS, ...dynamicProjects];

        // Sort projects: featured first, then by year (newest first)
        allProjects.sort((a, b) => {
          if (a.featured && !b.featured) return -1;
          if (!a.featured && b.featured) return 1;
          return b.year - a.year;
        });

        // Render projects
        renderProjects(allProjects);

        // Hide loading and show portfolio
        loadingState.style.display = 'none';
        portfolioGrid.style.display = 'grid';

        // Animate projects in
        setTimeout(() => {
          const projectItems = document.querySelectorAll('.project-item');
          projectItems.forEach((item, index) => {
            setTimeout(() => {
              item.classList.add('loaded');
            }, index * 100);
          });
        }, 100);

      } catch (error) {
        console.error('Error loading projects:', error);
        
        // Show error state
        loadingState.style.display = 'none';
        errorState.style.display = 'block';
        portfolioGrid.style.display = 'none';
      }
    }

    function renderProjects(projects) {
      const portfolioGrid = document.getElementById('portfolio-grid');
      portfolioGrid.innerHTML = '';

      projects.forEach(project => {
        const projectElement = createProjectElement(project);
        portfolioGrid.appendChild(projectElement);
      });
    }

    function createProjectElement(project) {
      const projectDiv = document.createElement('div');
      projectDiv.className = 'project-item';
      projectDiv.style.position = 'relative';

      // Create media element
      let mediaElement;
      const isVideo = project.mediaType === 'video' || 
                     (project.coverMedia && (project.coverMedia.includes('.mp4') || project.coverMedia.includes('.mov')));

      if (isVideo) {
        mediaElement = document.createElement('video');
        mediaElement.className = 'project-media';
        mediaElement.autoplay = true;
        mediaElement.loop = true;
        mediaElement.muted = true;
        mediaElement.playsInline = true;
        
        const source = document.createElement('source');
        source.src = project.coverMedia || '/api/projects/' + project.id + '/cover';
        source.type = 'video/mp4';
        mediaElement.appendChild(source);
      } else {
        mediaElement = document.createElement('img');
        mediaElement.className = 'project-media';
        mediaElement.src = project.coverMedia || '/api/projects/' + project.id + '/cover';
        mediaElement.alt = project.title;
      }

      // Featured badge
      let featuredBadge = '';
      if (project.featured) {
        featuredBadge = '<div class="featured-badge">Featured</div>';
      }

      // Create project HTML
      projectDiv.innerHTML = `
        ${featuredBadge}
        <div class="project-meta">
          <h3>${project.title}</h3>
          <div class="project-year">${project.year}</div>
        </div>
        <div class="project-overlay">
          <div class="project-title">${project.title}</div>
          <div class="project-description">
            ${project.description}
          </div>
          <div class="project-tags">
            ${project.tags.map(tag => `<span class="project-tag">${tag}</span>`).join('')}
          </div>
          <a href="${project.externalLink || '#'}" ${project.externalLink && project.externalLink.startsWith('http') ? 'target="_blank"' : ''} class="project-link">View Project</a>
        </div>
      `;

      // Insert media element at the beginning
      projectDiv.insertBefore(mediaElement, projectDiv.firstChild);

      return projectDiv;
    }

    // Add some mobile-friendly interactions
    if ('ontouchstart' in window) {
      document.addEventListener('touchstart', function() {
        // Enable hover states on mobile
        document.body.classList.add('touch-device');
      });
    }
  </script>

</html>
